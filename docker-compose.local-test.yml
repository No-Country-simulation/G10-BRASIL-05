services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: mediflow
      POSTGRES_PASSWORD: mediflow_local_test
      POSTGRES_DB: mediflow_local_test
    ports:
      - "5435:5432"
    volumes:
      - postgres_local_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mediflow -d mediflow_local_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    volumes:
      - redis_local_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - mongo_local_test_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand(\"ping\").ok' | grep 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      APP_ENV: local
      APP_HOST: 0.0.0.0
      APP_PORT: "8000"
      DATABASE_URL: postgresql+psycopg://mediflow:mediflow_local_test@postgres:5432/mediflow_local_test
      REDIS_URL: redis://redis:6379/0
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: mediflow_auditoria_local_test
      OCI_AUTH_MODE: api_key
      OCI_KEY_FILE: /run/secrets/oci_api_key.pem
      OPENROUTER_MANAGEMENT_KEY: ""
    volumes:
      - "${OCI_KEY_FILE}:/run/secrets/oci_api_key.pem:ro"
      - backend_local_test_storage:/app/Storage
    ports:
      - "8767:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_local_test_data:
  redis_local_test_data:
  mongo_local_test_data:
  backend_local_test_storage:
