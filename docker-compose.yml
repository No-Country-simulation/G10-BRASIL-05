services:
  postgres:
    profiles: ["infra"]
    image: postgres:16
    container_name: g10-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
      POSTGRES_DB: ${DB_NAME:-mediflow_db}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-mediflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    profiles: ["infra"]
    image: redis:7-alpine
    container_name: g10-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  mongodb:
    profiles: ["infra"]
    image: mongo:7
    container_name: g10-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-mediflow_auditoria}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-api:
    profiles: ["integrations"]
    image: evoapicloud/evolution-api:v2.2.2
    container_name: g10-evolution-api
    restart: unless-stopped
    ports:
      - "${EVOLUTION_PORT:-8080}:8080"
    environment:
      - SERVER_URL=${EVOLUTION_SERVER_URL:-http://localhost:8080}
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:-mediflow_secret_evolution_key}
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-root}@postgres:5432/${DB_NAME:-mediflow_db}
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_DATA_NEW_MESSAGE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
      - CACHE_REDIS_PREFIX_KEY=evolution
      - CACHE_REDIS_SAVE_INSTANCES=true
    volumes:
      - evolutiondata:/evolution/store

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: g10-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-root}@postgres:5432/${DB_NAME:-mediflow_db}
      REDIS_URL: redis://redis:6379/0
      REDIS_ENABLED: "true"
      MONGODB_URL: mongodb://mongodb:27017
      MONGODB_DATABASE: ${MONGO_DB:-mediflow_auditoria}
      MONGODB_ENABLED: "true"
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-mediflow_secret_evolution_key}
      CORS_ORIGINS: '["http://localhost:8501", "http://127.0.0.1:8501"]'
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./Storage:/app/Storage
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: g10-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      # Dentro do Compose, localhost aponta ao container Streamlit; use o serviço backend.
      API_URL_LOCAL: http://backend:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      BROWSER_GATHER_USAGE_STATS: "false"
    ports:
      - "${FRONTEND_PORT:-8501}:8501"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  mongodata:
  evolutiondata:
